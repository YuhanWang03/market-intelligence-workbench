# AI Hedge Fund Web — nginx site (mirrors production).
# Reverse-proxies the AI workbench and its FastAPI backends over HTTPS.
#
# The TLS lines marked "managed by Certbot" reference certificates that only
# exist on the VPS. First install (new server):
#   sudo cp web/deploy/nginx-web.conf /etc/nginx/sites-available/hedge-fund-web.conf
#   sudo ln -sf /etc/nginx/sites-available/hedge-fund-web.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d market-workbench.duckdns.org --redirect
#   sudo nginx -t && sudo systemctl reload nginx
#
# Updating an existing server: NEVER blind-copy over the live file. Diff first,
# then port only the changed location/proxy lines, or re-run
# `certbot install --nginx --cert-name market-workbench.duckdns.org --redirect`
# after copying so the 443 listener and certificate paths come back:
#   diff /etc/nginx/sites-available/hedge-fund-web.conf web/deploy/nginx-web.conf
# (An earlier copy of this file had only the port-80 block; copying it over the
# live config removed the 443 listener and took the site offline.)

server {
    server_name market-workbench.duckdns.org;

    # Vinext production server for the new Core / Research / Lab workbench.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Agent V3 remains an API-only service consumed by the workbench and bot.
    # There is no separate Agent V3 web page.
    location /api/agent-v3/ {
        proxy_pass http://127.0.0.1:8104;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    # API → FastAPI backend. Research-class agent requests run as pollable
    # jobs, but an inline explain_move or knowledge answer can still take
    # 30-90s (Tavily + DeepSeek), so give the upstream a generous read timeout.
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/market-workbench.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/market-workbench.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = market-workbench.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    listen [::]:80 default_server;
    server_name market-workbench.duckdns.org;
    return 404; # managed by Certbot


}
