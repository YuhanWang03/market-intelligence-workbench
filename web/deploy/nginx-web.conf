# AI Hedge Fund Web — nginx site.
# Reverse-proxies the AI workbench and its FastAPI backends.
#
# Install:
#   sudo cp web/deploy/nginx-web.conf /etc/nginx/sites-available/hedge-fund-web.conf
#   sudo ln -sf /etc/nginx/sites-available/hedge-fund-web.conf /etc/nginx/sites-enabled/
#   # disable the frozen old dashboard site if it was enabled:
#   sudo rm -f /etc/nginx/sites-enabled/dashboard.conf
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Vinext production server for the new Core / Research / Lab workbench.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    # Agent V3 remains an API-only service consumed by the workbench and bot.
    # There is no separate Agent V3 web page.
    location /api/agent-v3/ {
        proxy_pass http://127.0.0.1:8104;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    # API → FastAPI backend. Research-class agent requests run as pollable
    # jobs, but an inline explain_move or knowledge answer can still take
    # 30-90s (Tavily + DeepSeek), so give the upstream a generous read timeout.
    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }
}
