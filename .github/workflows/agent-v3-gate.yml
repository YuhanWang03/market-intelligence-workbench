name: agent-v3-gate

on:
  push:
    branches: [main]
    paths: ["v2/agent_v3/**", "v2/agent_v2/**", "v2/agent_common/**", "v2/agent_eval/**", "v2/agent_bench/**", ".github/workflows/agent-v3-gate.yml"]
  pull_request:
    paths: ["v2/agent_v3/**", "v2/agent_v2/**", "v2/agent_common/**", "v2/agent_eval/**", "v2/agent_bench/**", ".github/workflows/agent-v3-gate.yml"]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The business lock (yfinance, edgartools, pandas, scipy 1.18) is
          # generated on 3.12 and is what the VPS runs; the core lock alone
          # cannot even collect the tests (pandas, beautifulsoup4).
          python-version: "3.12"
          cache: pip
          cache-dependency-path: v2/agent_v3/requirements-business.lock
      - run: python -m pip install -r v2/agent_v3/requirements-business.lock
      - run: python -m pip check
      - run: python -m pytest v2/agent_v3/tests v2/agent_common v2/agent_bench/tests -q -p no:cacheprovider
      - run: python -m v2.agent_v3 --demo
